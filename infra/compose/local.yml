name: astrafile-local
services:
  astrafile-postgres:
    image: astrafile-postgres:17.11-hardened
    build:
      context: ../..
      dockerfile: infra/Dockerfile.postgres
    environment:
      POSTGRES_USER: astrafile
      POSTGRES_DB: astrafile
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup:local}
    ports: ["127.0.0.1:18432:5432"]
    volumes: ["astrafile-postgres:/var/lib/postgresql/data"]
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astrafile -d astrafile"]
      interval: 5s
      timeout: 3s
      retries: 20
  astrafile-redis:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports: ["127.0.0.1:18479:6379"]
    volumes:
      - ../../.secrets/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - astrafile-redis:/data
    restart: unless-stopped
    mem_limit: 256m
  astrafile-storage:
    image: astrafile-storage:4.45-hardened
    build:
      context: ../..
      dockerfile: infra/Dockerfile.storage
    environment:
      GOMEMLIMIT: 768MiB
      GOGC: 50
    command: ["server", "-dir=/data", "-s3", "-metricsPort=9324", "-s3.config=/etc/astrafile/s3.json", "-volume.max=0", "-master.volumeSizeLimitMB=1024", "-ip=astrafile-storage", "-ip.bind=0.0.0.0", "-s3.allowedOrigins=http://localhost:18400"]
    ports: ["127.0.0.1:18401:8333", "127.0.0.1:18403:9324"]
    volumes:
      - ../../.secrets/s3.json:/etc/astrafile/s3.json:ro
      - astrafile-storage:/data
    restart: unless-stopped
    mem_limit: 1536m
volumes:
  astrafile-postgres:
  astrafile-redis:
  astrafile-storage:
networks:
  default:
    name: astrafile-local-private
