worker_processes auto;
pid /var/run/nginx.pid;
events { worker_connections 4096; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 75s;
    client_header_timeout 30s;
    client_body_timeout 3600s;
    send_timeout 3600s;
    # Deliberately omit the query string, cookies and credentials from logs.
    map $uri $safe_path {
        default $uri;
        ~^/s/ /s/;
    }
    log_format astrafile escape=json '{"time":"$time_iso8601","method":"$request_method","path":"$safe_path","status":$status,"requestBytes":$request_length,"responseBytes":$body_bytes_sent,"seconds":$request_time}';
    # Docker rotates this safe access stream; nginx error messages can contain signed query strings.
    access_log /dev/stdout astrafile;
    error_log /dev/null crit;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ASTRAFILE_TLS:10m;
    ssl_session_timeout 1d;
    ssl_certificate /etc/astrafile/tls.crt;
    ssl_certificate_key /etc/astrafile/tls.key;
    upstream astrafile_control { server astrafile-api:4000; keepalive 32; }
    upstream astrafile_objects { server astrafile-storage:8333; keepalive 32; }
    server {
        listen 8443 ssl;
        http2 on;
        client_max_body_size 128k;
        # Same-origin data plane. Preserve Host, path and query for SigV4.
        # File bytes go straight to storage and never enter the Node API.
        location ^~ /astrafile/ {
            client_max_body_size 512m;
            proxy_pass http://astrafile_objects;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header Cookie "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For "";
            proxy_hide_header Set-Cookie;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_max_temp_file_size 0;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
            add_header Cache-Control "private, no-store" always;
        }
        location / {
            proxy_pass http://astrafile_control;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 120s;
        }
        location = /api/admin/events {
            proxy_pass http://astrafile_control;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_read_timeout 86400s;
        }
    }
    server {
        listen 8444 ssl;
        http2 on;
        # This is a per-part ceiling; entire objects can be much larger.
        client_max_body_size 512m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        location / {
            proxy_pass http://astrafile_objects;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header Cookie "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For "";
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_max_temp_file_size 0;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
