# Optional AstraFile-only HTTP-01 routing for the reviewed public IP.
# Existing virtual-host files and HTTPS configuration remain unchanged.
server {
    listen 80;
    server_name __PUBLIC_IP__;
    access_log off;
    error_log /dev/null crit;
    location ^~ /.well-known/acme-challenge/ {
        root /srv/astrafile/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    # Preserve the existing IP HTTP redirect for non-challenge requests.
    location / { return 301 https://__PUBLIC_IP__$request_uri; }
}
