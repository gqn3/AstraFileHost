name: Bug report
description: Report a reproducible problem using synthetic data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, private logs, user files or capability URLs. Report vulnerabilities through SECURITY.md."
  - type: input
    id: version
    attributes: {label: Version and environment, description: "Release/commit, OS, browser and storage backend; no private hostnames."}
    validations: {required: true}
  - type: textarea
    id: reproduction
    attributes: {label: Steps to reproduce, description: Use a minimal disposable example.}
    validations: {required: true}
  - type: textarea
    id: result
    attributes: {label: Expected and actual behavior}
    validations: {required: true}
  - type: textarea
    id: evidence
    attributes: {label: Sanitized evidence, description: Safe error codes and demo screenshots only.}
